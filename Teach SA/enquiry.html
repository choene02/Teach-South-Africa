<section class="enquiry-section">
  <h2>Enquire About Teach South Africa</h2>
  <p>Want to become an ambassador or learn more? Send us a message.</p>
  
  <form id="enquiryForm" class="enquiry-form" action="#" method="POST">
    
    <div class="form-group">
      <label for="name">Full Name *</label>
      <input type="text" id="name" name="name" required>
    </div>

    <div class="form-group">
      <label for="email">Email Address *</label>
      <input type="email" id="email" name="email" required>
    </div>

    <div class="form-group">
      <label for="phone">Phone Number</label>
      <input type="tel" id="phone" name="phone" placeholder="082 123 4567">
    </div>

    <div class="form-group">
      <label for="interest">I am interested in *</label>
      <select id="interest" name="interest" required>
        <option value="">Select an option</option>
        <option value="ambassador">Become An Ambassador</option>
        <option value="partner">Partnership Opportunities</option>
        <option value="volunteer">Volunteering</option>
        <option value="general">General Enquiry</option>
      </select>
    </div>

    <div class="form-group">
      <label for="message">Your Message *</label>
      <textarea id="message" name="message" rows="5" required></textarea>
    </div>

    <button type="submit" class="submit-btn">Send Enquiry</button>
    <p id="form-status"></p>

  </form>
</section>
